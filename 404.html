    <!-- Edit 4: PROXY INJECTION — redirect /api/* and /uploads/* to vlvc.ru -->
    <script>
    (function(){
      var BASE='https://vlvc.ru';
      var origFetch=window.fetch;
      window.fetch=function(url,opts){
        if(typeof url==='string'){
          if(url.startsWith('/api/')||url.startsWith('/uploads/'))url=BASE+url;
        }else if(url&&url.url){
          if(typeof url.url==='string'&&(url.url.startsWith('/api/')||url.url.startsWith('/uploads/'))){
            url=new Request(BASE+url.url,{method:url.method,headers:url.headers,body:url.body,mode:url.mode,credentials:url.credentials,cache:url.cache,redirect:url.redirect,referrer:url.referrer,integrity:url.integrity});
          }
        }
        return origFetch.call(this,url,opts);
      };
      var origOpen=XMLHttpRequest.prototype.open;
      XMLHttpRequest.prototype.open=function(method,url){
        if(typeof url==='string'&&(url.startsWith('/api/')||url.startsWith('/uploads/'))){
          arguments[1]=BASE+url;
        }
        return origOpen.apply(this,arguments);
      };
      function fixSrc(el){
        if(el.tagName==='IMG'||el.tagName==='SOURCE'){
          var src=el.getAttribute('src');
          if(src&&(src.startsWith('/uploads/')||src.startsWith('/api/')))el.setAttribute('src',BASE+src);
        }
      }
      document.addEventListener('DOMContentLoaded',function(){
        var obs=new MutationObserver(function(muts){
          muts.forEach(function(m){
            m.addedNodes.forEach(function(node){
              if(node.nodeType===1){
                fixSrc(node);
                if(node.querySelectorAll)node.querySelectorAll('img,source').forEach(fixSrc);
              }
            });
          });
        });
        obs.observe(document.body,{childList:true,subtree:true});
        document.querySelectorAll('img,source').forEach(fixSrc);
      });
    })();
    </script>
